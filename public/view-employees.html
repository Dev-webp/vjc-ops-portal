<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employees — VJC Ops Portal</title>
<link rel="stylesheet" href="/css/style.css" />

<style>
  .employee-page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }

  .employee-page-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .employee-page-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #e8f1ff;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .employee-page-title h1 {
    margin: 0;
  }

  .employee-page-title p {
    margin: 4px 0 0;
    color: #718096;
    font-size: 13px;
  }

  .employee-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .employee-section-title h3 {
    margin: 0;
    font-size: 18px;
    color: #17345f;
  }

  .employee-section-title p {
    margin: 5px 0 0;
    color: #7b8798;
    font-size: 13px;
  }

  .employee-tools {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .employee-search {
    width: 340px;
    height: 44px;
    border: 1px solid #dbe4f0;
    border-radius: 10px;
    padding: 0 15px;
    outline: none;
    background: #f8faff;
    color: #26364d;
    font-size: 13px;
    box-sizing: border-box;
  }

  .employee-search:focus {
    background: #fff;
    border-color: #6ea8ff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, .10);
  }

  .status-filter {
    height: 44px;
    border: 1px solid #dbe4f0;
    border-radius: 10px;
    padding: 0 13px;
    background: #fff;
    color: #26364d;
    font-size: 13px;
    outline: none;
  }

  .employee-table-wrap {
    overflow-x: auto;
    border: 1px solid #e4eaf2;
    border-radius: 10px;
  }

  .employee-table {
    width: 100%;
    min-width: 1100px;
    border-collapse: separate;
    border-spacing: 0;
  }

  .employee-table th {
    background: #f5f7fb;
    color: #64748b;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
    padding: 14px 13px;
    border-bottom: 1px solid #e3e8f0;
    text-align: left;
    white-space: nowrap;
  }

  .employee-table td {
    padding: 14px 13px;
    border-bottom: 1px solid #edf1f6;
    color: #24324a;
    font-size: 13px;
    vertical-align: middle;
  }

  .employee-table tbody tr:last-child td {
    border-bottom: none;
  }

  .employee-table tbody tr {
    transition: background .18s ease;
  }

  .employee-table tbody tr:hover {
    background: #f8fbff;
  }

  .serial-number {
    width: 42px;
    color: #7c8ba1;
    font-weight: 600;
  }

  .employee-info {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 160px;
  }

  .employee-avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
  }

  .employee-name {
    font-weight: 700;
    color: #17345f;
    text-transform: capitalize;
  }

  .employee-email {
    color: #53657c;
    white-space: nowrap;
  }

  .password-value {
    font-family: monospace;
    font-size: 12px;
    color: #334155;
    white-space: nowrap;
  }

  .role-badge,
  .work-badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .role-employee {
    background: #e9f2ff;
    color: #2772d6;
  }

  .role-manager {
    background: #e4f8ef;
    color: #15966a;
  }

  .role-mis {
    background: #fde8f1;
    color: #e84f8a;
  }

  .role-consultant {
    background: #fff0e4;
    color: #e27a20;
  }

  .role-default {
    background: #eef2f7;
    color: #526276;
  }

  .work-counselor {
    background: #eaf2ff;
    color: #3678df;
  }

  .work-case {
    background: #f0e9ff;
    color: #8153d6;
  }

  .work-auditor {
    background: #fff1dc;
    color: #e58a16;
  }

  .work-manager {
    background: #ffe9ed;
    color: #e45b70;
  }

  .work-default {
    background: #eef2f7;
    color: #526276;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }

  .status-badge.active {
    background: #e6f8ee;
    color: #15965f;
  }

  .status-badge.inactive {
    background: #fde9eb;
    color: #d94755;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .action-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .employee-edit-btn {
    height: 36px;
    padding: 0 14px;
    border: 1px solid #d8e1ed;
    border-radius: 8px;
    background: #fff;
    color: #17345f;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .employee-edit-btn:hover {
    background: #f3f7ff;
    border-color: #a9c4e8;
  }

  .employee-more-btn {
    width: 32px;
    height: 36px;
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 20px;
    cursor: pointer;
  }

  .employee-more-btn:hover {
    color: #2563eb;
  }

  .employee-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    color: #64748b;
    font-size: 13px;
  }

  .employee-pagination {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .page-btn {
    width: 38px;
    height: 38px;
    border: 1px solid #dbe3ee;
    border-radius: 9px;
    background: #fff;
    color: #526276;
    cursor: pointer;
  }

  .page-btn.active {
    background: #287be8;
    color: #fff;
    border-color: #287be8;
  }

  .empty-state {
    padding: 38px !important;
    text-align: center;
    color: #8793a5;
  }

  @media (max-width: 900px) {
    .employee-tools {
      width: 100%;
    }

    .employee-search {
      width: 100%;
    }

    .employee-footer {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
  }
</style>
</head>

<body>

<div class="app-shell">

  <div class="sidebar" id="sidebar"></div>

  <div class="main">

    <div class="employee-page-header">

      <div class="employee-page-title">
        <div class="employee-page-icon">👥</div>

        <div>
          <h1>Employees</h1>
          <p>Manage team members and their access to the OPS portal</p>
        </div>
      </div>

      <a
        href="/add-employee.html"
        class="btn-primary"
        style="width:auto;padding:12px 20px;white-space:nowrap;"
      >
        + Add Employee
      </a>

    </div>

    <div class="stat-grid" id="employeeStatGrid"></div>

    <div class="section-card">

      <div class="employee-toolbar">

        <div class="employee-section-title">
          <h3>All Employees</h3>
          <p>View and manage all team members</p>
        </div>

        <div class="employee-tools">

<input
  type="search"
  id="employeeSearch"
  class="employee-search"
  name="employee-search-box"
  placeholder="Search by name, email, role or profile..."
  autocomplete="new-password"
/>

          <select id="employeeStatusFilter" class="status-filter">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>

        </div>

      </div>

      <div class="employee-table-wrap">

        <table class="employee-table">

          <thead>
            <tr>
              <th>#</th>
              <th>Employee</th>
              <th>Email</th>
              <th>Password</th>
              <th>VJC Role</th>
              <th>OPS Work Profile</th>
              <th>Branch</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="employeesBody">
            <tr>
              <td colspan="9" class="empty-state">Loading…</td>
            </tr>
          </tbody>

        </table>

      </div>

      <div class="employee-footer">

        <div id="employeeCountText">
          Showing 0 employees
        </div>

        <div class="employee-pagination">
          <button class="page-btn" type="button">‹</button>
          <button class="page-btn active" type="button">1</button>
          <button class="page-btn" type="button">›</button>
        </div>

      </div>

    </div>

  </div>

</div>


<!-- EDIT EMPLOYEE MODAL -->

<div id="editEmployeeModal" class="modal-overlay" style="display:none;">

  <div class="modal-box">

    <h2>Edit Employee</h2>

    <div class="field">
      <label>Name</label>
      <input id="editName" />
    </div>

    <div class="form-inline-grid">

      <div class="field">
        <label>Role</label>
        <select id="editRole"></select>
      </div>

      <div class="field">
        <label>Branch</label>
        <select id="editBranch"></select>
      </div>

    </div>

    <div class="field">
      <label>Specialty (optional — e.g. UK Specialist)</label>
      <input id="editSpecialty" />
    </div>

    <div class="field">

      <label>Status</label>

      <select id="editActive">
        <option value="true">Active</option>
        <option value="false">
          Inactive (blocked from logging in)
        </option>
      </select>

    </div>
<div class="field">

  <label style="font-weight:700;">
    OPS Work Profiles
  </label>

  <div
    id="editWorkProfileGrid"
    style="
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:8px;
    "
  >

    <label
      style="
        display:flex;
        align-items:center;
        gap:10px;
        padding:12px;
        border:1px solid #dfe4ec;
        border-radius:10px;
        cursor:pointer;
        background:#fff;
      "
    >
      <input
        type="checkbox"
        name="edit_work_profile"
        value="MD"
      >
      <strong>MD</strong>
    </label>

    <label
      style="
        display:flex;
        align-items:center;
        gap:10px;
        padding:12px;
        border:1px solid #dfe4ec;
        border-radius:10px;
        cursor:pointer;
        background:#fff;
      "
    >
      <input
        type="checkbox"
        name="edit_work_profile"
        value="OPS_MANAGER"
      >
      <strong>OPS Manager</strong>
    </label>

    <label
      style="
        display:flex;
        align-items:center;
        gap:10px;
        padding:12px;
        border:1px solid #dfe4ec;
        border-radius:10px;
        cursor:pointer;
        background:#fff;
      "
    >
      <input
        type="checkbox"
        name="edit_work_profile"
        value="COUNSELOR"
      >
      <strong>Counselor</strong>
    </label>

    <label
      style="
        display:flex;
        align-items:center;
        gap:10px;
        padding:12px;
        border:1px solid #dfe4ec;
        border-radius:10px;
        cursor:pointer;
        background:#fff;
      "
    >
      <input
        type="checkbox"
        name="edit_work_profile"
        value="AUDITOR"
      >
      <strong>Auditor</strong>
    </label>

    <label
      style="
        display:flex;
        align-items:center;
        gap:10px;
        padding:12px;
        border:1px solid #dfe4ec;
        border-radius:10px;
        cursor:pointer;
        background:#fff;
      "
    >
      <input
        type="checkbox"
        name="edit_work_profile"
        value="CASE_OFFICER"
      >
      <strong>Case Officer</strong>
    </label>

  </div>

  <div style="margin-top:7px;font-size:12px;color:#6b7280;">
    Select one or more OPS Work Profiles.
  </div>

</div>
    <div class="field">

      <label>
        Reset Password (leave blank to keep current password)
      </label>

      <input
        id="editPassword"
        type="password"
        placeholder="New password (min 6 characters)"
      />

    </div>

    <div class="modal-actions">

      <button
        type="button"
        class="btn-primary"
        style="width:auto"
        id="saveEditBtn"
      >
        Save Changes
      </button>

      <button
        type="button"
        class="btn-secondary"
        id="closeEditBtn"
      >
        Cancel
      </button>

    </div>

    <div id="editError" style="margin-top:10px;"></div>

  </div>

</div>


<script src="/js/api.js"></script>
<script src="/js/view-employees.js"></script>

</body>
</html>
